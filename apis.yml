name: FTN Network
description: FTN Network is a New York-based sports data, analytics, and content company
  founded in 2020 that helps fans, fantasy players, and sports bettors make smarter
  decisions. FTN operates the FTN Fantasy platform (ftnfantasy.com), publishing proprietary
  NFL charting data, projections, DFS ownership, and betting analytics through articles,
  livestreams, videos, and podcasts. FTN also sells a REST/JSON sports-data API covering
  NFL, NBA, MLB, NHL, PGA, CFB, and CBB across CSV, mid-tier API, and enterprise white-label
  plans. The company went through the Techstars Sports Tech Accelerator (2022) and is
  backed by 11 Tribes Ventures.
